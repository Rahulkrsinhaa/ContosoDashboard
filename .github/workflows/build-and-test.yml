name: Build and Test

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore application and test dependencies
        run: dotnet restore ContosoDashboard.Tests/ContosoDashboard.Tests.csproj

      - name: Build application
        run: dotnet build ContosoDashboard/ContosoDashboard.csproj --no-restore

      - name: Run tests
        run: dotnet test ContosoDashboard.Tests/ContosoDashboard.Tests.csproj --no-restore